services:
  # Day 2 Tool: Web Application Firewall (WAF)
  wordpress-modsec:
    image: owasp/modsecurity-crs:nginx
    platform: linux/amd64
    ports:
      - "8080:80"

    networks:
      - soc-network

    healthcheck:
      test: ["CMD-SHELL", "wget --spider -q http://localhost || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # Day 2 Tool: Identity & Access Management (IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev

    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin

    ports:
      - "8081:8080"

    networks:
      - soc-network

    # Persistent storage
    volumes:
      - keycloak_data:/opt/keycloak/data

    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  keycloak_data:

networks:
  soc-network:
    driver: bridge