services:
  # Day 2 Tool: Web Application Firewall (WAF)
  wordpress-modsec:
    image: owasp/modsecurity-crs:nginx
    platform: linux/amd64
    ports:
      - "8080:80"

  # Day 2 Tool: Identity & Access Management (IAM)
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      - KEYCLOAK_ADMIN=admin
      - KEYCLOAK_ADMIN_PASSWORD=admin
    ports:
      - "8081:8080"